buildscript {
    repositories {
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "com.gradle.publish:plugin-publish-plugin:0.9.1"
        classpath 'org.ow2.asm:asm:6.2.1'
        classpath 'org.ow2.asm:asm-tree:6.2.1'
    }
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: "com.gradle.plugin-publish"

group = 'net.minecraftforge.gradle'
version = '2.5-SNAPSHOT'
//version = '2.2.1'
//configurations.all {
//    resolutionStrategy {
//        failOnDynamicVersions()
//    }
//}

dependencyLocking {
    lockAllConfigurations()
}

configurations {
    compileClasspath {
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.resources:3.12.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.commands:3.12.200'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.runtime:3.12.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.filesystem:1.7.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.text:3.6.300'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.expressions:3.6.300'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.equinox.common:3.12.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.equinox.preferences:3.7.300'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.equinox.registry:3.12.200'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.jobs:3.8.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.contenttype:3.7.100'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.equinox.app:1.3.600'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.osgi:3.12.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.resources:3.12.0'
    }
    shade {
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.resources:3.12.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.commands:3.12.200'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.runtime:3.12.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.filesystem:1.7.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.text:3.6.300'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.expressions:3.6.300'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.equinox.common:3.12.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.equinox.preferences:3.7.300'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.equinox.registry:3.12.200'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.jobs:3.8.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.contenttype:3.7.100'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.equinox.app:1.3.600'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.osgi:3.12.0'
        resolutionStrategy.force 'org.eclipse.platform:org.eclipse.core.resources:3.12.0'
    }
}

base {
    archivesName = 'ForgeGradle'
}
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "forge"
        url = "https://files.minecraftforge.net/maven"
    }

    // because SS and its snapshot
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/repositories/snapshots/"
    }


    // because of the GradleStart stuff
    maven {
        name = "mojang"
        url = "https://libraries.minecraft.net/"
    }
}

configurations {
    deployerJars
    shade
    compileOnly.extendsFrom shade
    all {
        resolutionStrategy {
            force 'org.ow2.asm:asm-commons:6.0'
            force 'org.ow2.asm:asm-tree:6.0'
            force 'org.ow2.asm:asm:6.0'
        }
    }
}

dependencies {
    compileOnly gradleApi()
    testImplementation('junit:junit:4.12')
    testImplementation gradleApi()
    // lombok
    compileOnly 'org.projectlombok:lombok:1.16.16'
    annotationProcessor 'org.projectlombok:lombok:1.16.16'
    // moved to the beginning to be the overrider
    //compile 'org.ow2.asm:asm-debug-all:6.0'
    shade 'com.google.guava:guava:18.0'
    testCompileOnly 'com.google.guava:guava:18.0'

    shade 'net.sf.opencsv:opencsv:2.3' // reading CSVs.. also used by SpecialSource
    shade 'com.cloudbees:diff4j:1.1' // for difing and patching
    shade 'com.github.abrarsyed.jastyle:jAstyle:1.3' // formatting
    shade 'net.sf.trove4j:trove4j:2.1.0' // because its awesome.

    shade 'com.github.jponge:lzma-java:1.3' // replaces the LZMA binary
    shade 'com.nothome:javaxdelta:2.0.1' // GDIFF implementation for BinPatches
    shade 'com.google.code.gson:gson:2.2.4' // Used instead of Argo for buuilding changelog.
    shade 'com.github.tony19:named-regexp:0.2.3' // 1.7 Named regexp features
    shade 'net.minecraftforge:forgeflower:1.0.342-SNAPSHOT' // Fernflower Forge edition
    testCompileOnly 'net.minecraftforge:forgeflower:1.0.342-SNAPSHOT' // Fernflower Forge edition

    shade 'net.md-5:SpecialSource:1.8.2' // deobf and reobf

    // because curse
    shade 'org.apache.httpcomponents:httpclient:4.3.3'
    shade 'org.apache.httpcomponents:httpmime:4.3.3'

    // mcp stuff
    shade 'de.oceanlabs.mcp:RetroGuard:3.6.6'
    shade('de.oceanlabs.mcp:mcinjector:3.4-SNAPSHOT'){
        exclude group: 'org.ow2.asm'
    }
    shade('net.minecraftforge:Srg2Source:5.0.13'){
        exclude group: 'org.ow2.asm'
        exclude group: 'cpw.mods',            module: 'modlauncher'
    }

    //Stuff used in the GradleStart classes
    shade 'com.mojang:authlib:1.5.16'
    shade('net.minecraft:launchwrapper:1.11'){
       exclude group: 'org.ow2.asm'
    }

    shade 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.1.3-2'
}

wrapper {
    gradleVersion = '8.13'
}

sourceSets {
    main.compileClasspath += configurations.shade;
    main.runtimeClasspath += configurations.shade;
    test.compileClasspath += configurations.shade;
    test.runtimeClasspath += configurations.shade;
}

compileJava {
	options.deprecation = true
	//options.compilerArgs += ["-Werror"]
	//options.compilerArgs += ["-Werror", "-Xlint:unchecked"]
}

processResources {
    // 设置重复文件处理策略为警告
    duplicatesStrategy = DuplicatesStrategy.WARN

    from(sourceSets.main.resources.srcDirs) {
        include 'forgegradle.version.txt'
        expand 'version': project.version
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'forgegradle.version.txt'
    }
}

jar {

    configurations.shade.each { dep ->
        /* I can use this again to find where dupes come from, so.. gunna just keep it here.
        logger.lifecycle(dep.toString())
        project.zipTree(dep).visit {
            element ->
                def path = element.relativePath.toString()
                if (path.contains('org/eclipse/core') && path.endsWith('.class'))
                    println "  $element.relativePath"

        }
        */
        from(project.zipTree(dep)){
            exclude 'META-INF', 'META-INF/**', '.api_description', '.options', 'about.html', 'module-info.class', 'plugin.properties', 'plugin.xml', 'about_files/**'
            duplicatesStrategy = 'warn'
        }
    }

    manifest {
        attributes 'version':project.version
        attributes 'javaCompliance': project.targetCompatibility
        attributes 'group':project.group
        attributes 'Implementation-Version': project.version + getGitHash()
    }
}

javadoc {
	classpath += configurations.compileOnly

    // linked javadoc urls.. why not...
    options.addStringOption 'link', 'https://gradle.org/docs/current/javadoc/'
    options.addStringOption 'link', 'http://docs.guava-libraries.googlecode.com/git-history/v18.0/javadoc'
    options.addStringOption 'link', 'http://asm.ow2.org/asm50/javadoc/user/'
}

tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    from javadoc
    // 将 classifier 替换为 archiveClassifier
    archiveClassifier = "javadoc"
}

artifacts {
    archives jar
    //archives javadocJar
}

test {
    if (project.hasProperty("filesmaven")) // disable this test when on the forge jenkins
        exclude "**/ExtensionMcpMappingTest*"
}

pluginBundle {
    website = 'http://www.gradle.org/'
    vcsUrl = 'https://github.com/MinecraftForge/ForgeGradle'
    description = 'Gradle plugin for all Minecraft mod development needs'
    tags = ['forge', 'minecraft', 'minecraftforge', 'sponge', 'mcp']

    plugins {
        patcher {
            id = 'net.minecraftforge.gradle.patcher'
            displayName = 'Minicraft Patcher Plugin'
        }
        tweakerClient {
            id = 'net.minecraftforge.gradle.tweaker-client'
            displayName = 'Mincraft Client Tweaker Plugin'
        }
        tweakerServer {
            id = 'net.minecraftforge.gradle.tweaker-server'
            displayName = 'Mincraft Server Tweaker Plugin'
        }
        forge {
            id = 'net.minecraftforge.gradle.forge'
            displayName = 'MincraftForge Mod Development Plugin'
        }

        launch4j {
            id = 'net.minecraftforge.gradle.launch4j'
            displayName = 'Specialized Launch4J Gradle Plugin'
        }
    }
}

// 替换原有的 uploadArchives 任务
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            groupId = project.group
            // 更新 artifactId 的引用方式
            artifactId = project.base.archivesName.get()
            version = project.version

            pom {
                name = project.base.archivesName.get()
                packaging = 'jar'
                description = 'Gradle plugin for Forge'
                url = 'https://github.com/MinecraftForge/ForgeGradle'

                scm {
                    url = 'https://github.com/MinecraftForge/ForgeGradle'
                    connection = 'scm:git:git://github.com/MinecraftForge/ForgeGradle.git'
                    developerConnection = 'scm:git:git@github.com:MinecraftForge/ForgeGradle.git'
                }

                issueManagement {
                    system = 'github'
                    url = 'https://github.com/MinecraftForge/ForgeGradle/issues'
                }

                licenses {
                    license {
                        name = 'Lesser GNU Public License, Version 2.1'
                        url = 'https://www.gnu.org/licenses/lgpl-2.1.html'
                        distribution = 'repo'
                    }
                }

                developers {
                    developer {
                        id = 'AbrarSyed'
                        name = 'Abrar Syed'
                        roles = ['developer']
                    }
                    developer {
                        id = 'LexManos'
                        name = 'Lex Manos'
                        roles = ['developer']
                    }
                }
            }
        }
    }

    repositories {
        maven {
            def releasesRepoUrl = "https://files.minecraftforge.net/maven/manage/upload"
            def localRepoUrl = "file://localhost/" + project.file('repo').getAbsolutePath()

            url = project.hasProperty('forgeMavenPassword') ? releasesRepoUrl : localRepoUrl

            if (project.hasProperty('forgeMavenPassword')) {
                credentials {
                    username = project.getProperty('forgeMavenUser')
                    password = project.getProperty('forgeMavenPassword')
                }
            }
        }
    }
}

// 您可以保留原来的 uploadArchives 任务作为兼容层，但将其重定向到新的发布任务
tasks.register("uploadArchives")  {
    dependsOn 'publish'
    doLast {
        logger.lifecycle("uploadArchives is deprecated, please use the 'publish' task instead")
    }
}

// write out version so its convenient for doc deployment
file('build').mkdirs()
file('build/version.txt').text = version;

def getGitHash() {
    def process = 'git rev-parse --short HEAD'.execute()
    process.waitFor()
    return '-' + (process.exitValue() ? 'unknown' : process.text.trim())
}
